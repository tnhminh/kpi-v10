name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kpi_ci
          POSTGRES_USER: kpi_ci
          POSTGRES_PASSWORD: kpi_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kpi_ci -d kpi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://kpi_ci:kpi_ci_password@127.0.0.1:5432/kpi_ci
      AUTH_SECRET: ci-only-auth-secret-value-at-least-32-characters
      METRICS_TOKEN: ci-only-metrics-token-value-at-least-32-characters
      LOG_LEVEL: warn
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: npm run verify

      - name: Apply migrations to clean PostgreSQL
        run: npm run db:migrate

      - name: Verify migration state
        run: npm run db:verify:migrations

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build production container image
        run: |
          set -euo pipefail
          image="kpi-v10-ci:${GITHUB_SHA}"
          docker build -t "$image" .
          image_id="$(docker image inspect "$image" --format '{{.Id}}')"
          test -n "$image_id"
          echo "container_image_id=$image_id"

      - name: Verify non-root container runtime and readiness
        run: |
          set -euo pipefail
          image="kpi-v10-ci:${GITHUB_SHA}"
          runtime_uid="$(docker run --rm --entrypoint id "$image" -u)"
          test "$runtime_uid" != "0"
          echo "container_runtime_uid=$runtime_uid"

          container_db_url="${DATABASE_URL/127.0.0.1/host.docker.internal}"
          docker run -d --name kpi-v10-ci-app \
            --add-host host.docker.internal:host-gateway \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e APP_URL \
            -e DATABASE_URL="$container_db_url" \
            -e AUTH_SECRET \
            -e METRICS_TOKEN \
            -e LOG_LEVEL \
            "$image"

          cleanup() {
            docker logs kpi-v10-ci-app || true
            docker rm -f kpi-v10-ci-app >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Container health endpoint did not become ready." >&2
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/api/health
          curl --fail --silent --show-error http://127.0.0.1:3000/api/ready
